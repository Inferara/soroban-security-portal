name: DB Backup

on:
  schedule:
    # Daily at 03:00 UTC (GitHub cron is UTC-only)
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NAMESPACE: sorobansecurityportal-ns
      POD_SELECTOR: app=prod-sorobansecurityportal-postgres
      RETAIN: '10'
      BACKUP_REPO: Inferara/sorobandb

    steps:
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Write kubeconfig from secret
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Dump database
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          export KUBECONFIG="$HOME/.kube/config"

          echo "Resolving postgres pod..."
          POD=$(kubectl get pod -n "$NAMESPACE" -l "$POD_SELECTOR" \
            -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$POD" ]; then
            echo "::error::No postgres pod found for selector $POD_SELECTOR in $NAMESPACE"
            exit 1
          fi
          echo "Using pod: $POD"

          STAMP=$(date -u +'%Y%m%d-%H%M%S')
          FILE="soroban-db-${STAMP}.dump"
          echo "BACKUP_FILE=$FILE" >> "$GITHUB_ENV"
          echo "BACKUP_TAG=backup-${STAMP}" >> "$GITHUB_ENV"

          echo "Running pg_dump -> $FILE"
          kubectl exec -n "$NAMESPACE" "$POD" -- \
            env PGPASSWORD="$DB_PASSWORD" \
            pg_dump -U "$DB_USER" -d "$DB_NAME" -Fc --no-owner --no-privileges \
            > "$FILE"

          if [ ! -s "$FILE" ]; then
            echo "::error::pg_dump produced an empty file; aborting before upload"
            exit 1
          fi
          echo "Backup size: $(du -h "$FILE" | cut -f1)"

      - name: Upload backup and prune old releases
        env:
          # gh CLI authenticates against the backup repo with this token.
          # Dumps exceed git's 100 MB limit, so they are stored as release
          # assets (2 GB/file) instead of committed files.
          GH_TOKEN: ${{ secrets.SOROBANDB_PAT }}
        run: |
          set -euo pipefail

          echo "Creating release $BACKUP_TAG with asset $BACKUP_FILE"
          gh release create "$BACKUP_TAG" "$BACKUP_FILE" \
            --repo "$BACKUP_REPO" \
            --title "$BACKUP_FILE" \
            --notes "Automated database backup ($BACKUP_FILE)."

          # Order backups by the timestamp in their tag (backup-YYYYMMDD-HHMMSS), not by the release's
          # createdAt: GitHub sets createdAt from the tagged commit, and every release here points at the
          # same old commit of the backup repo, so all releases tie and the newest one could be pruned
          # first (this deleted every new backup for months). Only tags of that exact shape are ever
          # touched, and the backup that was just created is never deleted.
          echo "Pruning to the newest $RETAIN backups..."
          gh release list --repo "$BACKUP_REPO" --limit 1000 --json tagName             | jq -r --argjson keep "$RETAIN" --arg current "$BACKUP_TAG"                 '[.[].tagName | select(test("^backup-[0-9]{8}-[0-9]{6}$"))]
                 | sort | reverse | .[$keep:] | .[] | select(. != $current)'             | while read -r tag; do
                [ -z "$tag" ] && continue
                echo "Deleting old release $tag"
                gh release delete "$tag" --repo "$BACKUP_REPO" --yes --cleanup-tag
              done

          # Fail the run (and so notify) if the backup we just made is not there.
          gh release view "$BACKUP_TAG" --repo "$BACKUP_REPO" --json assets -q '.assets[].name' | grep -qx "$BACKUP_FILE"             || { echo "::error::Backup $BACKUP_FILE is missing from $BACKUP_REPO after pruning"; exit 1; }
